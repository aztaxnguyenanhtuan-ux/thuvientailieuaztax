                "text": "Doanh nghiệp FDI tại Việt Nam bắt buộc phải áp dụng Chế độ Kế toán Doanh nghiệp Việt Nam (VAS) theo Thông tư 200/2014/TT-BTC (hoặc Thông tư 133/2016/TT-BTC nếu thuộc nhóm doanh nghiệp vừa và nhỏ). Báo cáo tài chính nộp cho cơ quan quản lý nhà nước phải sử dụng đơn vị tiền tệ là Đồng Việt Nam (VND) và được lập bằng tiếng Việt."
